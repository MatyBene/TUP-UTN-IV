        const quizForm = document.getElementById('quiz-form');
        const resultsContainer = document.getElementById('results');
        let numCorrect = 0;
        let numAnswered = 0;
        let quizData = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function selectRandomQuestions() {
            shuffleArray(allQuestions);
            quizData = allQuestions.slice(0, 23);
        }

        function checkAnswer(questionIndex, userAnswer) {
            const currentQuestion = quizData[questionIndex];
            const feedbackEl = document.getElementById(`feedback-${questionIndex}`);
            const questionContainerEl = document.getElementById(`question-container-${questionIndex}`);
            const radioButtons = document.querySelectorAll(`input[name=question${questionIndex}]`);

            feedbackEl.style.display = 'block';
            
            if (userAnswer === currentQuestion.answer) {
                numCorrect++;
                feedbackEl.innerHTML = `<strong>Correcto.</strong> ${currentQuestion.explanation}`;
                feedbackEl.className = 'feedback correct';
                questionContainerEl.style.borderColor = '#27ae60';
            } else {
                feedbackEl.innerHTML = `<strong>Incorrecto.</strong> La respuesta correcta es <strong>"${currentQuestion.answer}"</strong>. ${currentQuestion.explanation}`;
                feedbackEl.className = 'feedback incorrect';
                questionContainerEl.style.borderColor = '#c0392b';
            }

            radioButtons.forEach(radio => {
                radio.disabled = true;
            });

            numAnswered++;
            updateOverallScore();
        }

        function updateOverallScore() {
            const score = numAnswered > 0 ? (numCorrect / numAnswered) * 100 : 0;
            
            resultsContainer.innerHTML = `Has respondido ${numAnswered} de ${quizData.length} preguntas. Aciertos: ${numCorrect} (${score.toFixed(2)}%).`;

            if (numAnswered === quizData.length) {
                 const finalScore = (numCorrect / quizData.length) * 100;
                 if(finalScore >= 60) {
                    resultsContainer.className = 'correct';
                    resultsContainer.innerHTML += " ¡Aprobado!";
                } else {
                    resultsContainer.className = 'incorrect';
                    resultsContainer.innerHTML += " Necesitas repasar un poco más.";
                }
            }
        }

        function renderQuiz() {
            let output = '';
            quizData.forEach((currentQuestion, questionIndex) => {
                let optionsOutput = '';
                currentQuestion.options.forEach(option => {
                    optionsOutput += `
                        <div>
                            <input type="radio" name="question${questionIndex}" value="${option}" id="q${questionIndex}o${option}">
                            <label for="q${questionIndex}o${option}">${option}</label>
                        </div>
                    `;
                });
                output += `
                    <div class="question" id="question-container-${questionIndex}">
                        <p>${questionIndex + 1}. ${currentQuestion.question}</p>
                        <div class="options">${optionsOutput}</div>
                        <div class="feedback" id="feedback-${questionIndex}" style="display:none;"></div>
                    </div>
                `;
            });
            quizForm.innerHTML = output;

            quizForm.addEventListener('change', (e) => {
                if (e.target.type === 'radio') {
                    const questionIndex = parseInt(e.target.name.replace('question', ''));
                    checkAnswer(questionIndex, e.target.value);
                }
            });
        }
        
        selectRandomQuestions();
        renderQuiz();
        updateOverallScore();

    </script>
