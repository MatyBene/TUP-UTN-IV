<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Dioses Griegos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>⚡ Gestión de Dioses Griegos ⚡</h1>
        <nav class="controls-nav">
            <div class="nav-buttons">
                <button id="mostrarTodosBtn">Mostrar Todos</button>
                <button id="mostrarSimpleBtn">Solo Nombre y Dominio</button>
            </div>
            <div class="nav-search">
                <input type="text" id="atributoInput" placeholder="Buscar por atributo (nombre, dominio, etc.)">
                <button id="buscarAtributoBtn">Buscar</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Agregar/Editar Dios</h2>
            <form id="diosForm">
                <input type="hidden" id="diosId">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="dominio">Dominio:</label>
                    <input type="text" id="dominio" required>
                </div>
                <div class="form-group">
                    <label for="simbolo">Símbolo:</label>
                    <input type="text" id="simbolo" required>
                </div>
                <div class="form-group">
                    <label for="poder">Poder:</label>
                    <input type="number" id="poder" required min="1" max="10000">
                </div>
                <div class="form-group">
                    <label for="ciudad">Ciudad:</label>
                    <input type="text" id="ciudad" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" id="submitBtn">Agregar Dios</button>
                    <button type="button" id="cancelBtn" style="display: none;">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="dioses-section">
            <h2>Lista de Dioses</h2>
            <div id="diosesList" class="dioses-container">
                <!-- Los dioses se cargarán aquí dinámicamente -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
